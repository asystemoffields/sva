[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "summon-verify-attention"
version = "0.1.0"
description = "Summon-Verify Attention adapters and experiments"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.45",
]

[tool.setuptools]
packages = ["sva"]
